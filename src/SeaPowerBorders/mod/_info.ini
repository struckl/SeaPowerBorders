Name=Sea Power Borders
Description=National borders, cities, capitals and naval bases of the mission's date on the tactical map (the Soviet Union, two Germanys and West Berlin, Yugoslavia; Leningrad, East Berlin, Bonn; anchors in blue for NATO, red for the Warsaw Pact). Toggle in the map's Layers menu, or Shift+F7 for borders and F7 for cities. In development. Requires Anchor Chain.

