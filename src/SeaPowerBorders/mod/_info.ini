[Language_en]
Name=R.A.T.S. Cities and Borders
Description=National borders, cities, capitals and naval bases of the mission's date on the tactical map (the Soviet Union, two Germanys and West Berlin, Yugoslavia; Leningrad, East Berlin, Bonn; anchors in blue for NATO, red for the Warsaw Pact), plus an optional coastal distance line. Display only: missions keep their own zones and rules, these lines are not them. Toggle in the map's Layers menu, or Shift+F7 for borders and F7 for cities. Requires Anchor Chain.

[Compatibility]
GreaterThanEqualToVersion=0.8.7
